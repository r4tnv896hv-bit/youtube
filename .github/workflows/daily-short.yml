name: Daily Short

on:
  schedule:
    - cron: "7 9 * * *" # 18:07 JST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autotube/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install -r autotube/requirements.txt

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:50021/version && exit 0
            sleep 2
          done
          echo "::warning::VOICEVOX engine did not start; Open JTalk will be used"

      - name: Render and upload next episode
        working-directory: autotube
        env:
          VOICEVOX_URL: http://localhost:50021
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: python run.py

      - name: Keep the rendered video
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: autotube/out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Record published episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autotube/published.json
          git diff --cached --quiet || { git commit -m "Record published episode"; git push; }
